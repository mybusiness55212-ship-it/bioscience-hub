<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Panel - BioScience Hub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-box { max-width: 700px; margin: 2rem auto; padding: 2rem; }
        input, select, textarea {
            width: 100%; padding: 0.8rem; margin: 0.5rem 0 1rem;
            background: rgba(15, 23, 42, 0.9); border: 1px solid #38bdf8;
            color: #fff; border-radius: 8px; font-size: 0.95rem;
        }
        .btn-primary {
            background: #38bdf8; color: #020617; font-weight: bold;
            padding: 0.8rem 1.5rem; border: none; border-radius: 8px; cursor: pointer;
        }
        .btn-danger {
            background: #ef4444; color: #fff; border: none;
            padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; margin-top: 0.5rem;
        }
        .manage-item {
            background: rgba(15, 23, 42, 0.6); padding: 1rem; margin-bottom: 0.8rem;
            border-radius: 8px; border-left: 3px solid #38bdf8;
            display: flex; justify-content: space-between; align-items: center;
        }
    </style>
</head>
<body>

    <header class="glass-header">
        <div class="logo">ADMIN <span>CONTROL PANEL</span></div>
        <a href="index.html" class="admin-link">← View Live Website</a>
    </header>

    <div id="loginSection" class="glass-card admin-box">
        <h2>Admin Authentication</h2>
        <input type="email" id="adminEmail" placeholder="Admin Email">
        <input type="password" id="adminPassword" placeholder="Admin Password">
        <button class="btn-primary" id="loginBtn">Login to Dashboard</button>
        <p id="loginError" style="color:#ef4444; margin-top:0.5rem;"></p>
    </div>

    <div id="dashboardSection" class="hidden" style="max-width: 800px; margin: 2rem auto; padding: 0 1rem;">
        
        <div style="text-align:right; margin-bottom:1rem;">
            <button class="btn-danger" id="logoutBtn">Logout</button>
        </div>

        <div class="glass-card" style="margin-bottom: 2rem;">
            <h2>1. Update Home Page Banner</h2>
            <label>Main Heading (HTML allowed for neon span):</label>
            <input type="text" id="homeTitleInput" placeholder="e.g., Evidence-Based <span>Fitness & Endocrine</span> Research">
            <label>Subtitle Description:</label>
            <input type="text" id="homeSubInput" placeholder="Enter home page subtitle...">
            <button class="btn-primary" id="saveHomeBtn">Update Home Page</button>
        </div>

        <div class="glass-card" style="margin-bottom: 2rem;">
            <h2>2. Publish New Research Article</h2>
            <label>Select Category:</label>
            <select id="artCategory">
                <option value="Pharmacology">Steroids & Pharmacology Science</option>
                <option value="PCT">Post-Cycle Therapy (PCT) Guide</option>
                <option value="Nutrition">Nutrition & Diet Science</option>
                <option value="General">General Awareness & Updates</option>
            </select>

            <label>Article Title:</label>
            <input type="text" id="artTitle" placeholder="e.g., Clomid vs Nolvadex Mechanism">

            <label>Short Summary (Card par dikhega):</label>
            <textarea id="artSummary" rows="2" placeholder="Brief 2-line overview..."></textarea>

            <label>Full Detailed Information (Expand karne par dikhega):</label>
            <textarea id="artDetails" rows="6" placeholder="Write complete research, doses, diet, science here..."></textarea>

            <button class="btn-primary" id="publishBtn">Publish Live Now</button>
        </div>

        <div class="glass-card">
            <h2>3. Manage Published Articles</h2>
            <div id="adminArticlesList" style="margin-top:1rem;"></div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, setDoc, getDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            const firebaseConfig = {
    apiKey: "AIzaSyAKphbLdXN9-sLIgnkmFRDPvVKmJI-LLc",
    authDomain: "bioscience-cms-a8c93.firebaseapp.com",
    projectId: "bioscience-cms-a8c93",
    storageBucket: "bioscience-cms-a8c93.appspot.com",
    messagingSenderId: "287852857500",
    appId: "1:287852857500:web:f859233d28faa58b3c0559"
};
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById("loginSection").classList.add("hidden");
                document.getElementById("dashboardSection").classList.remove("hidden");
                loadDashboardData();
            } else {
                document.getElementById("loginSection").classList.remove("hidden");
                document.getElementById("dashboardSection").classList.add("hidden");
            }
        });

        document.getElementById("loginBtn").addEventListener("click", () => {
            const email = document.getElementById("adminEmail").value;
            const pass = document.getElementById("adminPassword").value;
            signInWithEmailAndPassword(auth, email, pass).catch(err => {
                document.getElementById("loginError").textContent = "Invalid Login: " + err.message;
            });
        });

        document.getElementById("logoutBtn").addEventListener("click", () => signOut(auth));

        document.getElementById("saveHomeBtn").addEventListener("click", async () => {
            const title = document.getElementById("homeTitleInput").value;
            const subtitle = document.getElementById("homeSubInput").value;
            await setDoc(doc(db, "settings", "home"), { title, subtitle });
            alert("Home Page Updated Live!");
        });

        document.getElementById("publishBtn").addEventListener("click", async () => {
            const category = document.getElementById("artCategory").value;
            const title = document.getElementById("artTitle").value;
            const summary = document.getElementById("artSummary").value;
            const details = document.getElementById("artDetails").value;

            if (!title || !summary || !details) return alert("Please fill all fields!");

            await addDoc(collection(db, "articles"), {
                category, title, summary, details,
                createdAt: serverTimestamp()
            });

            alert("Article Published Live!");
            document.getElementById("artTitle").value = "";
            document.getElementById("artSummary").value = "";
            document.getElementById("artDetails").value = "";
            loadDashboardData();
        });

        async function loadDashboardData() {
            const homeSnap = await getDoc(doc(db, "settings", "home"));
            if (homeSnap.exists()) {
                document.getElementById("homeTitleInput").value = homeSnap.data().title;
                document.getElementById("homeSubInput").value = homeSnap.data().subtitle;
            }

            const q = query(collection(db, "articles"), orderBy("createdAt", "desc"));
            const snap = await getDocs(q);
            const list = document.getElementById("adminArticlesList");
            list.innerHTML = "";

            snap.forEach((docSnap) => {
                const data = docSnap.data();
                const div = document.createElement("div");
                div.className = "manage-item";
                div.innerHTML = `
                    <div>
                        <strong>[${data.category}]</strong> ${data.title}
                    </div>
                    <button class="btn-danger" onclick="deleteArticle('${docSnap.id}')">Delete</button>
                `;
                list.appendChild(div);
            });
        }

        window.deleteArticle = async function(id) {
            if (confirm("Are you sure you want to delete this article?")) {
                await deleteDoc(doc(db, "articles", id));
                loadDashboardData();
            }
        };
    </script>
</body>
</html>
