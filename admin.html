<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Control Panel | BioScience Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">BIOSCIENCE ADMIN</a>
    <div>
      <a href="index.html" class="nav-btn" style="margin-right:0.6rem;">View Live Website</a>
      <button id="logoutBtn" class="danger-btn" style="display:none;">Logout</button>
    </div>
  </nav>

  <main class="container">

    <!-- LOGIN SECTION -->
    <div id="loginSection" class="admin-box" style="max-width:440px;">
      <h2>Admin Authentication</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="adminEmail">Admin Email</label>
          <input type="email" id="adminEmail" class="form-control" placeholder="abudhabisyed80@gmail.com" required />
        </div>
        <div class="form-group">
          <label for="adminPassword">Password</label>
          <input type="password" id="adminPassword" class="form-control" placeholder="Enter your password" required />
        </div>
        <button type="submit" class="primary-btn">Login to Dashboard</button>
        <div id="loginStatus" class="status-msg"></div>
      </form>
    </div>

    <!-- DASHBOARD SECTION -->
    <div id="dashboardSection" style="display:none;">

      <!-- 1. Home Banner Updater -->
      <div class="admin-box">
        <h2>1. Update Home Page Banner</h2>
        <form id="bannerForm">
          <div class="form-group">
            <label for="bannerTitle">Main Hero Title</label>
            <input type="text" id="bannerTitle" class="form-control" required />
          </div>
          <div class="form-group">
            <label for="bannerSubtitle">Hero Subtitle</label>
            <input type="text" id="bannerSubtitle" class="form-control" required />
          </div>
          <button type="submit" class="primary-btn">Save Banner Changes</button>
          <div id="bannerStatus" class="status-msg"></div>
        </form>
      </div>

      <!-- 2. Publish / Edit Research Article -->
      <div class="admin-box">
        <h2 id="formHeading">2. Publish New Research Article / PDF Book</h2>
        <form id="articleForm">
          <input type="hidden" id="editArticleId" value="" />
          <div class="form-group">
            <label for="articleCategory">Select Category</label>
            <select id="articleCategory" class="form-control" required>
              <option value="Steroids & Pharmacology">Steroids &amp; Pharmacology</option>
              <option value="Post-Cycle Therapy (PCT)">Post-Cycle Therapy (PCT)</option>
              <option value="Nutrition & Diet Science">Nutrition &amp; Diet Science</option>
              <option value="General Updates">General Updates</option>
            </select>
          </div>
          <div class="form-group">
            <label for="articleTitle">Article / Book Title</label>
            <input type="text" id="articleTitle" class="form-control" placeholder="e.g., Dianabol Mechanism" required />
          </div>
          <div class="form-group">
            <label for="articleSummary">Short Summary</label>
            <input type="text" id="articleSummary" class="form-control" placeholder="Brief overview..." required />
          </div>
          <div class="form-group">
            <label for="articleContent">Full Detailed Scientific Information</label>
            <textarea id="articleContent" class="form-control" placeholder="Write description..."></textarea>
          </div>
          <div class="form-group">
            <label for="pdfUrlInput">PDF Download Link (Google Drive / Direct URL)</label>
            <input type="url" id="pdfUrlInput" class="form-control" placeholder="https://drive.google.com/file/d/.../view" />
          </div>
          <button type="submit" id="submitBtn" class="primary-btn">Publish Live Now</button>
          <button type="button" id="cancelEditBtn" class="danger-btn" style="display:none; width:100%; margin-top:0.6rem;">Cancel Edit</button>
          <div id="articleStatus" class="status-msg"></div>
        </form>
      </div>

      <!-- 3. Manage Published Articles -->
      <div class="admin-box">
        <h2>3. Manage Published Items (Edit or Delete)</h2>
        <div id="manageList">
          <p style="color:#94a3b8;">Loading items...</p>
        </div>
      </div>

    </div>
  </main>

  <footer>
    BioScience Hub CMS &bull; Secure Firebase Cloud Backend
  </footer>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, getDoc, addDoc, updateDoc, getDocs, deleteDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDMmITK0UccstsasUCmDGnEoskDDCyTpIc",
      authDomain: "bioscience-cms-3c193.firebaseapp.com",
      projectId: "bioscience-cms-3c193",
      storageBucket: "bioscience-cms-3c193.firebasestorage.app",
      messagingSenderId: "727673748710",
      appId: "1:727673748710:web:361f104a46e3bcb75fcf27"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginSection = document.getElementById("loginSection");
    const dashboardSection = document.getElementById("dashboardSection");
    const logoutBtn = document.getElementById("logoutBtn");
    const loginStatus = document.getElementById("loginStatus");

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginSection.style.display = "none";
        dashboardSection.style.display = "block";
        logoutBtn.style.display = "inline-block";
        loadCurrentBanner();
        loadAdminArticles();
      } else {
        loginSection.style.display = "block";
        dashboardSection.style.display = "none";
        logoutBtn.style.display = "none";
      }
    });

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("adminEmail").value.trim();
      const password = document.getElementById("adminPassword").value;
      loginStatus.style.color = "#00f0ff";
      loginStatus.textContent = "Authenticating...";

      try {
        await signInWithEmailAndPassword(auth, email, password);
        loginStatus.textContent = "";
      } catch (err) {
        loginStatus.style.color = "#ff3b5c";
        loginStatus.textContent = "Login Failed: " + err.message;
      }
    });

    logoutBtn.addEventListener("click", () => signOut(auth));

    async function loadCurrentBanner() {
      try {
        const snap = await getDoc(doc(db, "settings", "homeBanner"));
        if (snap.exists()) {
          document.getElementById("bannerTitle").value = snap.data().title || "";
          document.getElementById("bannerSubtitle").value = snap.data().subtitle || "";
        }
      } catch (err) {}
    }

    document.getElementById("bannerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const status = document.getElementById("bannerStatus");
      status.style.color = "#00f0ff";
      status.textContent = "Saving banner...";

      try {
        await setDoc(doc(db, "settings", "homeBanner"), {
          title: document.getElementById("bannerTitle").value.trim(),
          subtitle: document.getElementById("bannerSubtitle").value.trim(),
          updatedAt: serverTimestamp()
        });
        status.style.color = "#00e676";
        status.textContent = "Home banner updated live!";
      } catch (err) {
        status.style.color = "#ff3b5c";
        status.textContent = "Error: " + err.message;
      }
    });

    // Publish or Update Article Form
    const articleForm = document.getElementById("articleForm");
    articleForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const status = document.getElementById("articleStatus");
      const editId = document.getElementById("editArticleId").value;
      status.style.color = "#00f0ff";
      status.textContent = editId ? "Updating article..." : "Publishing live...";

      try {
        const articleData = {
          category: document.getElementById("articleCategory").value,
          title: document.getElementById("articleTitle").value.trim(),
          summary: document.getElementById("articleSummary").value.trim(),
          content: document.getElementById("articleContent").value.trim(),
          pdfUrl: document.getElementById("pdfUrlInput").value.trim(),
          updatedAt: serverTimestamp()
        };

        if (editId) {
          await updateDoc(doc(db, "articles", editId), articleData);
          status.style.color = "#00e676";
          status.textContent = "Article updated successfully!";
          resetForm();
        } else {
          articleData.createdAt = serverTimestamp();
          await addDoc(collection(db, "articles"), articleData);
          status.style.color = "#00e676";
          status.textContent = "Published successfully!";
          articleForm.reset();
        }
        loadAdminArticles();
      } catch (err) {
        status.style.color = "#ff3b5c";
        status.textContent = "Error: " + err.message;
      }
    });

    function resetForm() {
      document.getElementById("editArticleId").value = "";
      document.getElementById("formHeading").textContent = "2. Publish New Research Article / PDF Book";
      document.getElementById("submitBtn").textContent = "Publish Live Now";
      document.getElementById("cancelEditBtn").style.display = "none";
      articleForm.reset();
    }

    document.getElementById("cancelEditBtn").addEventListener("click", resetForm);

    async function loadAdminArticles() {
      const manageList = document.getElementById("manageList");
      try {
        const q = query(collection(db, "articles"), orderBy("createdAt", "desc"));
        const snap = await getDocs(q);

        if (snap.empty) {
          manageList.innerHTML = `<p style="color:#94a3b8;">No items published yet.</p>`;
          return;
        }

        manageList.innerHTML = "";
        snap.forEach(docSnap => {
          const data = docSnap.data();
          const item = document.createElement("div");
          item.className = "manage-item";
          item.innerHTML = `
            <div>
              <strong style="color:#fff;">${escapeHtml(data.title)}</strong>
              <div style="font-size:0.82rem; color:#00f0ff;">${escapeHtml(data.category)}</div>
            </div>
            <div style="display:flex; gap:0.5rem;">
              <button class="nav-btn edit-btn" style="padding:0.4rem 0.8rem; font-size:0.85rem;">Edit</button>
              <button class="danger-btn delete-btn">Delete</button>
            </div>
          `;

          // Edit Click
          item.querySelector(".edit-btn").addEventListener("click", () => {
            document.getElementById("editArticleId").value = docSnap.id;
            document.getElementById("articleCategory").value = data.category || "Steroids & Pharmacology";
            document.getElementById("articleTitle").value = data.title || "";
            document.getElementById("articleSummary").value = data.summary || "";
            document.getElementById("articleContent").value = data.content || "";
            document.getElementById("pdfUrlInput").value = data.pdfUrl || "";
            document.getElementById("formHeading").textContent = "Edit Research Article";
            document.getElementById("submitBtn").textContent = "Update Article";
            document.getElementById("cancelEditBtn").style.display = "block";
            window.scrollTo({ top: 300, behavior: 'smooth' });
          });

          // Delete Click
          item.querySelector(".delete-btn").addEventListener("click", async () => {
            if (confirm("Permanently delete this item?")) {
              await deleteDoc(doc(db, "articles", docSnap.id));
              loadAdminArticles();
            }
          });

          manageList.appendChild(item);
        });
      } catch (err) {
        manageList.innerHTML = `<p style="color:#ff3b5c;">Error: ${err.message}</p>`;
      }
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
