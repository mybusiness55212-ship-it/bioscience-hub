<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BioScience & Pharmacology Research Hub</title>
  <style>
    :root {
      --bg-color: #030712;
      --card-bg: rgba(13, 20, 38, 0.75);
      --neon-blue: #00f0ff;
      --neon-glow: rgba(0, 240, 255, 0.25);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --border-color: rgba(0, 240, 255, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
      padding: 1.5rem;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 30px var(--neon-glow);
    }

    header h1 {
      color: var(--neon-blue);
      font-size: 2rem;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .articles-grid {
      display: grid;
      gap: 1.5rem;
    }

    .article-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
      transition: all 0.3s ease;
    }

    .article-card:hover {
      border-color: var(--neon-blue);
      box-shadow: 0 0 25px var(--neon-glow);
    }

    .article-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .badge {
      font-size: 0.75rem;
      color: var(--neon-blue);
      text-transform: uppercase;
      letter-spacing: 1px;
      background: rgba(0, 240, 255, 0.1);
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
    }

    .status {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .article-title {
      color: var(--text-main);
      font-size: 1.25rem;
      margin-bottom: 0.75rem;
    }

    .article-desc {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
      line-height: 1.5;
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }

    /* Clean Sleek Action Button */
    .action-btn {
      background: transparent;
      color: var(--neon-blue);
      border: 1px solid var(--neon-blue);
      padding: 0.5rem 1.25rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .action-btn:hover {
      background: var(--neon-blue);
      color: #030712;
      box-shadow: 0 0 15px var(--neon-glow);
    }

    /* Subtle Sponsor Link */
    .sponsor-link {
      color: var(--text-muted);
      font-size: 0.8rem;
      text-decoration: none;
      transition: color 0.2s;
      margin-left: auto;
    }

    .sponsor-link:hover {
      color: var(--neon-blue);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>BioScience Hub</h1>
      <p>Advanced Pharmacology & Clinical Research Documentation Portal</p>
    </header>

    <div class="articles-grid" id="liveArticlesContainer">
      <p style="color: var(--text-muted); text-align: center;">Loading live research papers...</p>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDMmITK0UccstsasUCmDGnEoskDDCyTpIc",
      authDomain: "bioscience-cms-3c193.firebaseapp.com",
      projectId: "bioscience-cms-3c193",
      storageBucket: "bioscience-cms-3c193.firebasestorage.app",
      messagingSenderId: "727673748710",
      appId: "1:727673748710:web:361f104a46e3bcb75fcf27"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const container = document.getElementById("liveArticlesContainer");

    async function fetchLiveArticles() {
      try {
        const q = query(collection(db, "articles"), orderBy("createdAt", "desc"));
        const snapshot = await getDocs(q);

        if (snapshot.empty) {
          container.innerHTML = `<p style="color: var(--text-muted); text-align: center;">No active research documents found.</p>`;
          return;
        }

        container.innerHTML = "";
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          
          const card = document.createElement("div");
          card.className = "article-card";
          card.innerHTML = `
            <div class="article-meta">
              <span class="badge">${data.category || 'Research'}</span>
              <span class="status">Active Node</span>
            </div>
            <h3 class="article-title">${data.title}</h3>
            <p class="article-desc">${data.description}</p>
            <div class="btn-group">
              <a href="${data.pdfUrl || '#'}" target="_blank" class="action-btn">
                📄 View / Download PDF
              </a>
              <a href="${data.adLink || '#'}" target="_blank" class="sponsor-link">
                ⚡ Sponsored Resource
              </a>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error(err);
        container.innerHTML = `<p style="color: #ff0055; text-align: center;">Failed to load live feed from database.</p>`;
      }
    }

    fetchLiveArticles();
  </script>
</body>
</html>
